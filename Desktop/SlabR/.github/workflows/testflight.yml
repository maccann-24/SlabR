name: TestFlight

# Manual trigger only — auto-deploy on push is disabled until
# code signing is configured.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm TestFlight upload"
        required: true

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # ---------------------------------------------------------
      # CODE SIGNING NOT YET CONFIGURED
      #
      # This workflow requires the following repository secrets:
      #   APPSTORE_ISSUER_ID   — App Store Connect API issuer ID
      #   APPSTORE_KEY_ID      — App Store Connect API key ID
      #   APPSTORE_PRIVATE_KEY — App Store Connect API private key (.p8)
      #
      # You will also need:
      #   - An ExportOptions.plist committed to the repo root
      #   - Provisioning profiles installed on the runner
      #   - Distribution certificate installed on the runner
      #
      # Until these are set up, this workflow WILL FAIL at the
      # archive step. See Apple docs on Xcode Cloud or use
      # fastlane match for certificate management.
      # ---------------------------------------------------------

      - name: Archive
        run: |
          xcodebuild archive \
            -project Slabr/Slabr.xcodeproj \
            -scheme Slabr \
            -archivePath Slabr.xcarchive \
            -configuration Release

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath Slabr.xcarchive \
            -exportPath Export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: Export/Slabr.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
