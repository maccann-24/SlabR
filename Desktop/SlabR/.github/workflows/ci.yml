name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import sys,json; devs=[d['name'] for r in json.load(sys.stdin)['devices'].values() for d in r if d['isAvailable'] and 'iPhone' in d['name']]; print(devs[0] if devs else 'iPhone 16 Pro')")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Create xcconfig for CI
        run: |
          cp Configuration/Dev.xcconfig.example Configuration/Dev.xcconfig
          cp Configuration/Prod.xcconfig.example Configuration/Prod.xcconfig

      - name: Build
        run: |
          xcodebuild build \
            -project Slabr/Slabr.xcodeproj \
            -scheme Slabr \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project Slabr/Slabr.xcodeproj \
            -scheme Slabr \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -configuration Debug \
            -resultBundlePath TestResults \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
