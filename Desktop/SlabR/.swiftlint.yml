disabled_rules:
  - trailing_whitespace    # handled by Xcode

opt_in_rules:
  - force_unwrapping       # no force unwraps ever
  - empty_string
  - literal_expression_end_indentation

excluded:
  - Pods
  - DerivedData
  - .build

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 600

force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: error
